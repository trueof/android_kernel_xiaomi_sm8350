name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make libncurses-dev libelf-dev python3

      - name: Clone toolchains
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          git clone --depth=1 https://github.com/nickolay-kondratyev/ci-clang-toolchains.git clang || true
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc-aarch64 || true
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc-arm || true

      - name: Clone KernelSU-Next
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 -b legacy https://github.com/KernelSU-Next/KernelSU-Next.git
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Apply kABI patches
        run: |
          cd $GITHUB_WORKSPACE
          curl -sL -o /tmp/p1.patch "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_3_4_5.patch"
          patch -p1 < /tmp/p1.patch || true
          curl -sL -o /tmp/p2.patch "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch"
          patch -p1 < /tmp/p2.patch || true

      - name: Add KSU hooks and configs
        run: |
          cd $GITHUB_WORKSPACE
          sed -i '/^int do_execve(/i #ifdef CONFIG_KSU\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif' fs/exec.c
          sed -i '/return do_execveat_common.*filename.*argv.*envp.*0/i #ifdef CONFIG_KSU\n\tksu_handle_execveat((int *)AT_FDCWD, \&filename, \&argv, \&envp, 0);\n#endif' fs/exec.c
          sed -i '/^SYSCALL_DEFINE3(faccessat/i #ifdef CONFIG_KSU\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif' fs/open.c
          sed -i '/return do_faccessat(dfd, filename, mode);/{ N; s/return do_faccessat(dfd, filename, mode);\n}/#ifdef CONFIG_KSU\n\tksu_handle_faccessat(\&dfd, \&filename, \&mode, NULL);\n#endif\n\treturn do_faccessat(dfd, filename, mode);\n}/ }' fs/open.c
          sed -i '/^ssize_t ksys_read/i #ifdef CONFIG_KSU\nextern bool ksu_vfs_read_hook __read_mostly;\nextern void ksu_handle_sys_read(unsigned int fd);\n#endif' fs/read_write.c
          sed -i '/struct fd f = fdget_pos(fd);/{ N; s/struct fd f = fdget_pos(fd);\n\tssize_t ret = -EBADF;/#ifdef CONFIG_KSU\n\tif (unlikely(ksu_vfs_read_hook))\n\t\tksu_handle_sys_read(fd);\n#endif\n\tstruct fd f = fdget_pos(fd);\n\tssize_t ret = -EBADF;/ }' fs/read_write.c
          sed -i '/^SYSCALL_DEFINE4(newfstatat/i #ifdef CONFIG_KSU\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n#endif' fs/stat.c
          sed -i '/struct kstat stat;/{ N; s/struct kstat stat;\n\tint error;/#ifdef CONFIG_KSU\n\tksu_handle_stat(\&dfd, \&filename, \&flag);\n#endif\n\tstruct kstat stat;\n\tint error;/ }' fs/stat.c
          sed -i '/^SYSCALL_DEFINE4(reboot/i #ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif' kernel/reboot.c
          sed -i '/struct pid_namespace \*pid_ns = task_active_pid_ns(current);/{ N; s/struct pid_namespace \*pid_ns = task_active_pid_ns(current);\n\tchar buffer\[256\];/#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, \&arg);\n#endif\n\tstruct pid_namespace *pid_ns = task_active_pid_ns(current);\n\tchar buffer[256];/ }' kernel/reboot.c

      - name: Build
        run: |
          cd $GITHUB_WORKSPACE
          C=$HOME/toolchains/clang/bin
          G=$HOME/toolchains/gcc-aarch64/bin
          A=$HOME/toolchains/gcc-arm/bin
          make O=out ARCH=arm64 PATH=$C:$G:$A:$PATH LLVM=1 LLVM_IAS=1 LD=ld.lld AR=llvm-ar NM=llvm-nm AS=llvm-as OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=$G/aarch64-linux-android- CROSS_COMPILE_ARM32=$A/arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu- vendor/lahaina-qgki_defconfig vendor/haydn_QGKI.config
          echo '# Droidspaces' >> out/.config
          echo 'CONFIG_SYSVIPC=y' >> out/.config
          echo 'CONFIG_POSIX_MQUEUE=y' >> out/.config
          echo 'CONFIG_IPC_NS=y' >> out/.config
          echo 'CONFIG_PID_NS=y' >> out/.config
          echo 'CONFIG_DEVTMPFS=y' >> out/.config
          echo 'CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y' >> out/.config
          echo 'CONFIG_TMPFS_POSIX_ACL=y' >> out/.config
          echo 'CONFIG_TMPFS_XATTR=y' >> out/.config
          echo 'CONFIG_KSU=y' >> out/.config
          echo 'CONFIG_KSU_MANUAL_HOOK=y' >> out/.config
          sed -i 's/^CONFIG_CNSS2=y/CONFIG_CNSS2=m/' out/.config
          sed -i 's/^CONFIG_ICNSS2=y/CONFIG_ICNSS2=m/' out/.config
          sed -i 's/^CONFIG_QTI_BATTERY_CHARGER=y/CONFIG_QTI_BATTERY_CHARGER=m/' out/.config
          sed -i 's/^CONFIG_LEDS_QTI_FLASH=y/CONFIG_LEDS_QTI_FLASH=m/' out/.config
          sed -i 's/^CONFIG_BACKLIGHT_QCOM_SPMI_WLED=y/CONFIG_BACKLIGHT_QCOM_SPMI_WLED=m/' out/.config
          make O=out ARCH=arm64 PATH=$C:$G:$A:$PATH LLVM=1 LLVM_IAS=1 LD=ld.lld AR=llvm-ar NM=llvm-nm AS=llvm-as OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=$G/aarch64-linux-android- CROSS_COMPILE_ARM32=$A/arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig
          make O=out ARCH=arm64 PATH=$C:$G:$A:$PATH LLVM=1 LLVM_IAS=1 LD=ld.lld AR=llvm-ar NM=llvm-nm AS=llvm-as OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=$G/aarch64-linux-android- CROSS_COMPILE_ARM32=$A/arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu- -j$(nproc) Image

      - name: Package
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git /tmp/ak3
          cp out/arch/arm64/boot/Image /tmp/ak3/
          cat > /tmp/ak3/anykernel.sh << 'EOF'
          properties() { '
          kernel.string=Droidspaces Kernel for haydn
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          device.name1=haydn
          '; }
          block=boot;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF
          cd /tmp/ak3 && zip -r9 $GITHUB_WORKSPACE/kernel.zip . -x '.git*'

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: kernel.zip
