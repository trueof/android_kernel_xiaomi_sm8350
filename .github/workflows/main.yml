name: Build Kernel with KernelSU-Next + Droidspaces

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make libc6-dev libncurses-dev libelf-dev crossbuild-essential-arm64 python3

      - name: Clone toolchains
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          git clone --depth=1 https://github.com/nickolay-kondratyev/ci-clang-toolchains.git clang-r383902b || true
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc-aarch64 || true
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc-arm || true

      - name: Apply kABI patches
        run: |
          cd $GITHUB_WORKSPACE
          # SYSVIPC kABI fix (3_4_5 version)
          curl -L -o /tmp/sysvipc.patch "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_3_4_5.patch"
          patch -p1 < /tmp/sysvipc.patch || echo "SYSVIPC patch already applied or failed"
          
          # POSIX_MQUEUE kABI fix
          curl -L -o /tmp/posix_mqueue.patch "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch"
          patch -p1 < /tmp/posix_mqueue.patch || echo "POSIX_MQUEUE patch already applied or failed"

      - name: Integrate KernelSU-Next
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 -b legacy https://github.com/KernelSU-Next/KernelSU-Next.git
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Add KernelSU hooks
        run: |
          cd $GITHUB_WORKSPACE
          # Add hooks to kernel source files
          python3 -c "
          import re

          # fs/exec.c - ksu_handle_execveat
          with open('fs/exec.c', 'r') as f:
              content = f.read()
          hook = '''
#ifdef CONFIG_KSU
extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,
                                void *argv, void *envp, int *flags);
#endif
'''
          if 'ksu_handle_execveat' not in content:
              content = content.replace(
                  'int do_execve(struct filename *filename,',
                  hook + 'int do_execve(struct filename *filename,'
              )
              call = '''
#ifdef CONFIG_KSU
\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);
#endif
'''
              content = content.replace(
                  '\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n}',
                  call + '\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n}'
              )
              with open('fs/exec.c', 'w') as f:
                  f.write(content)

          # fs/open.c - ksu_handle_faccessat
          with open('fs/open.c', 'r') as f:
              content = f.read()
          if 'ksu_handle_faccessat' not in content:
              content = content.replace(
                  'SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n{\n\treturn do_faccessat(dfd, filename, mode);',
                  '''SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)
{
#ifdef CONFIG_KSU
\textern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);
\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);
#endif
\treturn do_faccessat(dfd, filename, mode);'''
              )
              with open('fs/open.c', 'w') as f:
                  f.write(content)

          # fs/read_write.c - ksu_handle_sys_read
          with open('fs/read_write.c', 'r') as f:
              content = f.read()
          if 'ksu_handle_sys_read' not in content:
              content = content.replace(
                  'ssize_t ksys_read(unsigned int fd, char __user *buf, size_t count)\n{\n\tstruct fd f = fdget_pos(fd);\n\tssize_t ret = -EBADF;',
                  '''ssize_t ksys_read(unsigned int fd, char __user *buf, size_t count)
{
\tstruct fd f = fdget_pos(fd);
\tssize_t ret = -EBADF;
#ifdef CONFIG_KSU
\textern bool ksu_vfs_read_hook __read_mostly;
\textern void ksu_handle_sys_read(unsigned int fd);
\tif (unlikely(ksu_vfs_read_hook))
\t\tksu_handle_sys_read(fd);
#endif'''
              )
              with open('fs/read_write.c', 'w') as f:
                  f.write(content)

          # fs/stat.c - ksu_handle_stat
          with open('fs/stat.c', 'r') as f:
              content = f.read()
          if 'ksu_handle_stat' not in content:
              content = content.replace(
                  'SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,\n\t\tstruct stat __user *, statbuf, int, flag)\n{\n\tstruct kstat stat;\n\tint error;',
                  '''SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,
\t\tstruct stat __user *, statbuf, int, flag)
{
\tstruct kstat stat;
\tint error;
#ifdef CONFIG_KSU
\textern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
\tksu_handle_stat(&dfd, &filename, &flag);
#endif'''
              )
              with open('fs/stat.c', 'w') as f:
                  f.write(content)

          # kernel/reboot.c - ksu_handle_sys_reboot
          with open('kernel/reboot.c', 'r') as f:
              content = f.read()
          if 'ksu_handle_sys_reboot' not in content:
              content = content.replace(
                  'SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n\t\tvoid __user *, arg)\n{\n\tstruct pid_namespace *pid_ns = task_active_pid_ns(current);\n\tchar buffer[256];\n\tint ret = 0;',
                  '''SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,
\t\tvoid __user *, arg)
{
\tstruct pid_namespace *pid_ns = task_active_pid_ns(current);
\tchar buffer[256];
\tint ret = 0;
#ifdef CONFIG_KSU
\textern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);
\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
#endif'''
              )
              with open('kernel/reboot.c', 'w') as f:
                  f.write(content)
          "

      - name: Add Droidspaces + KernelSU configs
        run: |
          cd $GITHUB_WORKSPACE
          cat >> arch/arm64/configs/vendor/lahaina-qgki_defconfig << 'EOF'
          
          # Droidspaces container support
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IPC_NS=y
          CONFIG_PID_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          
          # KernelSU Next
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          EOF

      - name: Fix Makefile for trace headers
        run: |
          cd $GITHUB_WORKSPACE
          # Add -I $(srctree)/$(src) for trace headers
          grep -q 'I.*srctree.*src' scripts/Makefile.lib || sed -i '/# \$(srctree)\/\$(src) for including checkin headers/a _c_flags   += -I $(srctree)/$(src)\n_a_flags   += -I $(srctree)/$(src)\n_cpp_flags += -I $(srctree)/$(src)' scripts/Makefile.lib

      - name: Build kernel
        run: |
          cd $GITHUB_WORKSPACE
          export CLANGDIR="$HOME/toolchains/clang-r383902b"
          export GCCDIR="$HOME/toolchains/gcc-aarch64"
          export GCCDIR32="$HOME/toolchains/gcc-arm"
          
          # Generate config
          make O=out ARCH=arm64 \
            PATH=$CLANGDIR/bin:$GCCDIR/bin:$PATH \
            LLVM=1 \
            LLVM_IAS=1 \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            AS=llvm-as \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=$GCCDIR/bin/aarch64-linux-android- \
            CROSS_COMPILE_ARM32=$GCCDIR32/bin/arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            vendor/lahaina-qgki_defconfig vendor/haydn_QGKI.config
          
          # Fix proprietary drivers
          sed -i 's/^CONFIG_CNSS2=y/CONFIG_CNSS2=m/' out/.config
          sed -i 's/^CONFIG_ICNSS2=y/CONFIG_ICNSS2=m/' out/.config
          sed -i 's/^CONFIG_QTI_BATTERY_CHARGER=y/CONFIG_QTI_BATTERY_CHARGER=m/' out/.config
          sed -i 's/^CONFIG_LEDS_QTI_FLASH=y/CONFIG_LEDS_QTI_FLASH=m/' out/.config
          sed -i 's/^CONFIG_BACKLIGHT_QCOM_SPMI_WLED=y/CONFIG_BACKLIGHT_QCOM_SPMI_WLED=m/' out/.config
          
          # Build
          make O=out ARCH=arm64 \
            PATH=$CLANGDIR/bin:$GCCDIR/bin:$PATH \
            LLVM=1 \
            LLVM_IAS=1 \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            AS=llvm-as \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=$GCCDIR/bin/aarch64-linux-android- \
            CROSS_COMPILE_ARM32=$GCCDIR32/bin/arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            -j$(nproc) Image

      - name: Create AnyKernel3 zip
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git /tmp/ak3
          cp out/arch/arm64/boot/Image /tmp/ak3/Image
          cat > /tmp/ak3/anykernel.sh << 'AK3EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers
          properties() { '
          kernel.string=Droidspaces Kernel for Redmi K40 Pro+ (haydn)
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=haydn
          supported.versions=
          supported.patchlevels=
          '; } # end properties
          block=boot;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          AK3EOF
          cd /tmp/ak3
          zip -r9 $GITHUB_WORKSPACE/droidspaces-kernel-haydn.zip . -x '*.git*'

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: droidspaces-kernel-haydn
          path: droidspaces-kernel-haydn.zip
