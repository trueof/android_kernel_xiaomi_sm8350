name: Build Kernel
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make libncurses-dev libelf-dev python3
      - name: Clone toolchains
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          git clone --depth=1 https://github.com/nickolay-kondratyev/ci-clang-toolchains.git clang || true
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc-aarch64 || true
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc-arm || true
          ls clang/bin/ld.lld
      - name: Setup KernelSU-Next
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 -b legacy https://github.com/KernelSU-Next/KernelSU-Next.git
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
          sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
      - name: Apply patches
        run: |
          cd $GITHUB_WORKSPACE
          curl -sL -o /tmp/p1.patch "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_3_4_5.patch"
          patch -p1 < /tmp/p1.patch || true
          curl -sL -o /tmp/p2.patch "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch"
          patch -p1 < /tmp/p2.patch || true
      - name: Build
        run: |
          cd $GITHUB_WORKSPACE
          export PATH="$HOME/toolchains/clang/bin:$HOME/toolchains/gcc-aarch64/bin:$HOME/toolchains/gcc-arm/bin:$PATH"
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 LD=ld.lld AR=llvm-ar NM=llvm-nm AS=llvm-as OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu- vendor/lahaina-qgki_defconfig vendor/haydn_QGKI.config
          echo "CONFIG_SYSVIPC=y" >> out/.config
          echo "CONFIG_POSIX_MQUEUE=y" >> out/.config
          echo "CONFIG_IPC_NS=y" >> out/.config
          echo "CONFIG_PID_NS=y" >> out/.config
          echo "CONFIG_DEVTMPFS=y" >> out/.config
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
          sed -i 's/^CONFIG_CNSS2=y/CONFIG_CNSS2=m/' out/.config
          sed -i 's/^CONFIG_ICNSS2=y/CONFIG_ICNSS2=m/' out/.config
          sed -i 's/^CONFIG_QTI_BATTERY_CHARGER=y/CONFIG_QTI_BATTERY_CHARGER=m/' out/.config
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 LD=ld.lld AR=llvm-ar NM=llvm-nm AS=llvm-as OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 LD=ld.lld AR=llvm-ar NM=llvm-nm AS=llvm-as OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- CLANG_TRIPLE=aarch64-linux-gnu- -j$(nproc) Image
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: out/arch/arm64/boot/Image
